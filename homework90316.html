
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冒險者的猜拳大對決</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", sans-serif;
      color: #fff8e7;
      background:
        radial-gradient(circle at top, #354b75 0%, transparent 50%),
        linear-gradient(135deg, #10172b, #202b46 60%, #382b4d);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 14px;
    }

    .game {
      width: 100%;
      max-width: 680px;
      padding: 30px;
      border: 2px solid #d9ad62;
      border-radius: 24px;
      background: rgba(12, 19, 37, 0.92);
      box-shadow: 0 0 35px #0008;
      text-align: center;
    }

    h1 {
      color: #ffd777;
      font-size: clamp(25px, 5vw, 36px);
      margin: 0 0 10px;
    }

    h2 {
      color: #ffd777;
      font-size: 21px;
    }

    .subtitle {
      color: #c7d4ef;
      margin-bottom: 26px;
    }

    .panel {
      padding: 20px;
      margin: 18px 0;
      border: 1px solid #536487;
      border-radius: 16px;
      background: #ffffff09;
    }

    label {
      display: block;
      text-align: left;
      margin: 14px 0 7px;
      color: #ffe4a6;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #7385a8;
      border-radius: 10px;
      background: #18233b;
      color: white;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
    }

    button:hover {
      filter: brightness(1.12);
      transform: translateY(-2px);
    }

    button:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }

    .primary {
      margin-top: 18px;
      width: 100%;
      color: #33220a;
      background: linear-gradient(135deg, #ffe39a, #dca448);
    }

    .hidden {
      display: none !important;
    }

    .adventurer {
      color: #ffe29b;
      font-size: 18px;
      line-height: 1.8;
    }

    .scoreboard {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 12px;
      margin: 20px 0;
    }

    .score {
      flex: 1;
      padding: 16px 8px;
      border-radius: 14px;
      background: #293653;
    }

    .score strong {
      display: block;
      font-size: 38px;
      color: #ffda7d;
      margin-top: 8px;
    }

    .versus {
      color: #9eafd1;
      font-weight: bold;
    }

    .choices {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 22px 0;
    }

    .choice {
      flex: 1;
      min-width: 0;
      color: white;
      background: #354666;
      border: 2px solid #7184a9;
    }

    .choice span {
      display: block;
      font-size: 35px;
      margin-bottom: 6px;
    }

    .choice:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .result {
      min-height: 76px;
      padding: 15px;
      border-radius: 12px;
      background: #080e1d80;
      line-height: 1.8;
    }

    .status {
      color: #c5d5f5;
      margin-top: 10px;
    }

    .restart {
      color: white;
      background: #495b7d;
      margin-top: 12px;
    }

    .footer {
      margin-top: 22px;
      font-size: 13px;
      color: #aab8d4;
    }

    @media (max-width: 480px) {
      .game {
        padding: 18px 12px;
      }

      .choices {
        gap: 6px;
      }

      .choice {
        padding: 10px 4px;
        font-size: 14px;
      }

      .choice span {
        font-size: 28px;
      }

      .score strong {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <h1>⚔️ 冒險者的猜拳大對決</h1>
    <p class="subtitle">勇者啊！準備好接受命運的挑戰了嗎？</p>

    <!-- 冒險者登入 -->
    <section id="login" class="panel">
      <h2>🧙 冒險者登入</h2>

      <label for="playerName">你的冒險者名字</label>
      <input
        id="playerName"
        type="text"
        maxlength="30"
        placeholder="請輸入你的名字"
      >

      <label for="equipment">選擇你的裝備</label>
      <select id="equipment">
        <option value="黃金鍵盤">⌨️ 黃金鍵盤</option>
        <option value="魔法魔杖">🪄 魔法魔杖</option>
        <option value="傳說之劍">⚔️ 傳說之劍</option>
        <option value="幸運護身符">🍀 幸運護身符</option>
      </select>

      <button class="primary" id="startButton">
        🚀 開始冒險
      </button>
    </section>

    <!-- 猜拳遊戲 -->
    <section id="battle" class="hidden">
      <div class="panel">
        <div class="adventurer" id="welcome"></div>
        <p>📜 規則：先取得 5 勝的一方獲得最終勝利！</p>
      </div>

      <div class="scoreboard">
        <div class="score">
          <div id="playerLabel">冒險者</div>
          <strong id="playerScore">0</strong>
          <small>勝場</small>
        </div>

        <div class="versus">VS</div>

        <div class="score">
          <div>🤖 電腦</div>
          <strong id="computerScore">0</strong>
          <small>勝場</small>
        </div>
      </div>

      <p id="roundLabel">第 1 回合</p>
      <h2>✊ 選擇你要出的拳！</h2>

      <div class="choices">
        <button class="choice" data-choice="剪刀">
          <span>✌️</span>剪刀
        </button>
        <button class="choice" data-choice="石頭">
          <span>✊</span>石頭
        </button>
        <button class="choice" data-choice="布">
          <span>✋</span>布
        </button>
      </div>

      <div class="result" id="result" aria-live="polite">
        等待勇者出拳……
      </div>

      <p class="status" id="status">⭐ 目標：率先取得 5 勝！</p>

      <button class="restart" id="restartButton">
        🔄 重新開始本局
      </button>

      <button class="restart" id="changePlayerButton">
        🧙 更換冒險者
      </button>
    </section>

    <footer class="footer">
      ✨ 勇氣與智慧，將帶領你走向勝利！ ✨
    </footer>
  </main>

  <script>
    // 遊戲資料
    const options = ["剪刀", "石頭", "布"];

    let name = "";
    let equipment = "";
    let playerWins = 0;
    let computerWins = 0;
    let roundNum = 1;
    let gameOver = false;

    // 取得網頁元素
    const login = document.getElementById("login");
    const battle = document.getElementById("battle");
    const playerNameInput = document.getElementById("playerName");
    const equipmentSelect = document.getElementById("equipment");

    const playerScore = document.getElementById("playerScore");
    const computerScore = document.getElementById("computerScore");
    const playerLabel = document.getElementById("playerLabel");
    const roundLabel = document.getElementById("roundLabel");
    const result = document.getElementById("result");
    const status = document.getElementById("status");
    const choiceButtons = document.querySelectorAll(".choice");

    // 開始冒險
    document.getElementById("startButton").addEventListener("click", () => {
      name = playerNameInput.value.trim();
      equipment = equipmentSelect.value;

      if (name === "") {
        alert("請先輸入你的冒險者名字！");
        playerNameInput.focus();
        return;
      }

      document.getElementById("welcome").textContent =
        `歡迎勇敢的冒險者【${name}】！你的裝備是【${equipment}】`;

      playerLabel.textContent = `🧙 ${name}`;

      login.classList.add("hidden");
      battle.classList.remove("hidden");

      resetGame();
    });

    // 玩家出拳
    choiceButtons.forEach((button) => {
      button.addEventListener("click", () => {
        if (gameOver) return;

        const playerChoice = button.dataset.choice;
        const computerChoice =
          options[Math.floor(Math.random() * options.length)];

        let message = `你出了【${playerChoice}】，電腦出了【${computerChoice}】。`;

        if (playerChoice === computerChoice) {
          message += "\n🤝 平手！雙方都沒有得分。";
        } else if (
          (playerChoice === "剪刀" && computerChoice === "布") ||
          (playerChoice === "石頭" && computerChoice === "剪刀") ||
          (playerChoice === "布" && computerChoice === "石頭")
        ) {
          playerWins++;
          message += "\n🎉 太棒了！這回合你贏了！";
        } else {
          computerWins++;
          message += "\n💥 哎呀！這回合電腦贏了！";
        }

        roundNum++;

        playerScore.textContent = playerWins;
        computerScore.textContent = computerWins;
        roundLabel.textContent = `第 ${roundNum - 1} 回合`;
        result.textContent = message;

        // 判斷是否有人先取得 5 勝
        if (playerWins >= 5) {
          gameOver = true;
          result.textContent +=
            `\n\n🏆 恭喜冒險者【${name}】以 ${playerWins}：${computerWins} 獲勝！`;
          status.textContent = "🌟 你已成為猜拳大師！";
        } else if (computerWins >= 5) {
          gameOver = true;
          result.textContent +=
            `\n\n💻 電腦以 ${computerWins}：${playerWins} 獲勝，再接再厲！`;
          status.textContent = "📜 勇者可以重新開始，再戰一局！";
        } else {
          status.textContent =
            `⭐ 目前戰況：你 ${playerWins} 勝，電腦 ${computerWins} 勝`;
        }

        if (gameOver) {
          choiceButtons.forEach((btn) => {
            btn.disabled = true;
          });
        }
      });
    });

    // 重設分數，開始新的一局
    function resetGame() {
      playerWins = 0;
      computerWins = 0;
      roundNum = 1;
      gameOver = false;

      playerScore.textContent = "0";
      computerScore.textContent = "0";
      roundLabel.textContent = "第 1 回合";
      result.textContent = "等待勇者出拳……";
      status.textContent = "⭐ 目標：率先取得 5 勝！";

      choiceButtons.forEach((btn) => {
        btn.disabled = false;
      });
    }

    // 重新開始本局
    document.getElementById("restartButton").addEventListener("click", () => {
      resetGame();
    });

    // 返回登入畫面
    document.getElementById("changePlayerButton").addEventListener("click", () => {
      battle.classList.add("hidden");
      login.classList.remove("hidden");
      playerNameInput.value = name;
      equipmentSelect.value = equipment;
      resetGame();
    });
  </script>
</body>
</html>
